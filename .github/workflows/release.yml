name: release

# A v* tag is the release trigger. Tag creation is restricted by a ruleset.
#
# What ships:
#   - GitHub release: one tarball (.zip on Windows) + SHA-256 per target,
#     SHA256SUMS, install.sh. Used by scripts/install.sh and by hand.
#   - npm: @proticom/webmcp (launcher) + five platform packages holding the
#     prebuilt binaries, published with provenance through OIDC trusted
#     publishing (no npm token anywhere). See docs/RELEASING.md.
#
# Nothing is code-signed or notarized: there is no Apple Developer ID. npm-
# delivered files are not quarantined by Gatekeeper; downloaded tarballs are.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64, bin: webmcp }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64, bin: webmcp }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, npm: linux-x64, bin: webmcp }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, npm: linux-arm64, bin: webmcp }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64, bin: webmcp.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match Cargo.toml and the npm packages
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$v"; exit 1; }
          node scripts/sync-versions.mjs --check --tag "${GITHUB_REF_NAME}"
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz + sha256)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          name=webmcp-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/webmcp LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Package (zip + sha256)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name=webmcp-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/webmcp.exe LICENSE NOTICE README.md "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      # The bare binary, for the npm platform package.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS
          cp scripts/install.sh dist/install.sh
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # npm trusted publishing: npm exchanges the job's OIDC token for a short-
  # lived publish credential, so there is no NODE_AUTH_TOKEN and setup-node
  # gets no registry-url. Each package name must be configured on npmjs.com
  # with (repository proticom/webmcp, workflow release.yml, environment
  # release); see docs/RELEASING.md. Requires npm >= 11.5.1.
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm must support trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [a,b,c]=require("child_process").execSync("npm --version").toString().trim().split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm too old for trusted publishing"); process.exit(1) }'
      - name: Versions must match the tag
        run: node scripts/sync-versions.mjs --check --tag "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-*
          path: npm-bins
      - name: Place each binary in its platform package
        run: |
          set -euo pipefail
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            install -m 0755 "npm-bins/npm-$p/webmcp" "npm/platforms/$p/webmcp"
          done
          install -m 0644 npm-bins/npm-win32-x64/webmcp.exe npm/platforms/win32-x64/webmcp.exe
          ls -l npm/platforms/*/webmcp*
          npm/platforms/linux-x64/webmcp --version
      - name: Publish the platform packages
        run: |
          set -euo pipefail
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            (cd "npm/platforms/$p" && npm publish --provenance --access public)
          done
      - name: Publish @proticom/webmcp
        run: cd npm/webmcp && npm publish --provenance --access public
